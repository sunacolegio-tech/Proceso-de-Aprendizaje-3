<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos - Ricocan y Ricocat</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="">
</head>
<body class="pagina-secundaria">
    <header class="cabecera-fija">
        <h1>Ricocan y Ricocat</h1>
        <nav>
            <ul class="menu" style="list-style: none; display: flex; justify-content: center; gap: 30px; align-items: center; margin: 0; padding: 0;">
                <a href="index.html"><i class="fa-solid fa-house"></i>INICIO</a>
                <a href="blog.html"><i class="fa-solid fa-blog"></i>BLOG</a>
                <a href="galeria.html"><i class="fa-solid fa-images"></i>GALERÍA</a>
                <a href="videos.html"><i class="fa-solid fa-video"></i>VIDEOS</a>
                <a href="contactos.html"><i class="fa-solid fa-address-book"></i>CONTACTOS</a>
                <a href="nosotros.html"><i class="fa-solid fa-users"></i>NOSOTROS</a>
            </ul>
        </nav>
    </header>
    <main id="pagina-contactos">
        <div class="contactos-superior">
            <section class="contactos-informacion">
                <table>
                    <tr>
                        <th colspan="2">Información de Contacto</th>
                    </tr>
                    <tr>
                        <td>Dirección</td>
                        <td>Lima, Perú</td>
                    </tr>
                    <tr>
                        <td>Telefóno</td>
                        <td>994 175 791</td>
                    </tr>
                    <tr>
                        <td>Correo</td>
                        <td>sunacuevarobles@gmail.com</td>
                    </tr>
                    <tr>
                        <th colspan="2">Horario de Atención</th>
                    </tr>
                    <tr>
                        <td colspan="2">Lunes a Sábado</td>
                    </tr>
                </table>
                <img src="Imagenes/Mascotas de Ricocan y Ricocat.jpg" alt="Mascotas de Ricocan y Ricocat">
            </section>
            <section class="contactos-formulario">
                <form>
                    <label>Nombre y Apellido</label>
                    <input type="text" placeholder="Tu nombre" required>
                    <label>Celular</label>
                    <input type="tel" placeholder="000 000 000" required>
                    <label>Correo electrónico</label>
                    <input type="email" placeholder="nombre@dominio.com" required>
                    <label>Mensaje</label>
                    <textarea placeholder="Escribe tu mensaje" required></textarea>
                    <button type="submit">ENVIAR</button>
                </form>
            </section>
        </div>
        <section class="contactos-mapa">
            <h2>Ubicación</h2>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d8375.03426422998!2d-77.0968069118724!3d-11.97403215300596!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9105ce0d77478ef1%3A0xc54075cfd98bc136!2sRicocan!5e0!3m2!1ses!2spe!4v1794337023724!5m2!1ses!2spe" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </section>
    </main>
    <footer>
        <p>Mundo Ricocan & Ricocat 2026</p>
    </footer>

</body>
</html>
